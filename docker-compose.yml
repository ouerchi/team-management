services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-team}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_password}
      POSTGRES_DB: ${POSTGRES_DB:-team_management}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    init: true
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-team}:${POSTGRES_PASSWORD:-local_demo_password}@db:5432/${POSTGRES_DB:-team_management}
      POSTGRES_USER: ${POSTGRES_USER:-team}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_password}
      POSTGRES_DB: ${POSTGRES_DB:-team_management}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
